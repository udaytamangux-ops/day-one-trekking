<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day One Trekking</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Ubuntu+Mono:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <a href="/" class="logo-wrap" aria-label="Day One Home">
            <img src="day-one-images/day-one.svg" alt="Day One Logo" class="logo-img" />
        </a>

        <div class="nav-right">
            <nav>
                <ul>
                    <li><a href="#about">About</a></li>
                    <li><a href="#treks">Treks</a></li>
                    <li><a href="#blogs">Blogs</a></li>
                    <li><a href="#gallery">Gallery</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>

            <a href="#plan" class="cta-button primary-button">
                <span class="text-bold">Plan Your Journey</span>
            </a>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <div class="hero-content">
                <h1 class="hero-title">Where every <span class="italic-brown">journey</span> begins.</h1>
                <p class="hero-body">
                    Curated expeditions for the modern explorer.<br>
                    Reconnect with the wild in comfort and style.
                </p>
                <a href="#journeys" class="secondary-button">
                    Explore Journeys
                    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 5H9M9 5L5 1M9 5L5 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </a>
            </div>

            <div class="hero-image-wrapper">
                <img src="day-one-images/hero Image.png" alt="Trekking Adventure" class="hero-image">
            </div>
        </section>

        <section class="philosophy-section">
            <div class="philosophy-label">Our Philosophy</div>
            <div class="philosophy-quote">
                <div class="quote-line line-bold">Born from the mountains.</div>
                <div class="quote-line line-italic">Crafted for explorers.</div>
                <div class="quote-line line-bold">Built on trust.</div>
            </div>
        </section>
    </main>


</body>

</html>
